# Fixed bug where agent was not told if episode truncated
snakev1:
  env_id: Snake-v0
  replay_memory_size: 100000
  mini_batch_size: 32
  epsilon_init: 1.0
  epsilon_decay: 0.99995
  epsilon_min: 0.01
  network_sync_rate: 1000
  learning_rate_a: 0.0001
  discount_factor_g: 0.99
  stop_on_reward: 100
  nodes: 128
  enable_double_dqn: True

